name: CI

on:
  push:
    branches: [main, "pre-*"]   # pre-<version>: the new source is tested BEFORE the exe is compiled (PR1, v0.20.1)
  pull_request:
  workflow_dispatch:            # start a run by hand (Actions -> CI -> Run workflow)

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system packages (Tk, virtual display, FFmpeg)
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb ffmpeg
      - name: Install Python packages
        run: pip install pytest jsonschema pillow openpyxl
      - name: Run tests
        run: python -m pytest tests -v
      - name: Run end-to-end self-test (virtual display)
        # the newest tests/selftest_v*.py, so the file name need not change with every version
        run: xvfb-run -a python -u "$(ls tests/selftest_v*.py | sort -V | tail -n 1)"
      - name: Run settings test harness (virtual display)
        run: PYTHONPATH=. xvfb-run -a python -u tests/settings_test_harness.py
